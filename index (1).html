<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Golden Sweet - المنيو</title>
<meta name="description" content="منيو Golden Sweet: كنافة، قطايف، بسبوسة، معمول وتورت. فرع موقف المنصورة وفرع الغشام.">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#fbf5e8;--bg2:#f3e7c8;--card:#ffffff;--text:#2a1d0a;--muted:#7a6238;--gold:#9a6b00;--gold2:#c99a1f;--pill-a:#f6d878;--pill-b:#e0ac2c;--pill-text:#1a1405;--line:#e6d29b;--hh:58px;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a0a0a;--bg2:#17120a;--card:#15120d;--text:#f6ead0;--muted:#bfa86a;--gold:#e8bd4c;--gold2:#f6d878;--line:#3d2f10;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0a0a0a;--bg2:#17120a;--card:#15120d;--text:#f6ead0;--muted:#bfa86a;--gold:#e8bd4c;--gold2:#f6d878;--line:#3d2f10;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 120px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Cairo",Tahoma,Arial,sans-serif;line-height:1.7;-webkit-text-size-adjust:100%}
a{color:inherit}
.wrap{max-width:1000px;margin:0 auto;padding:0 16px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;height:var(--hh);background:var(--bg);border-bottom:1px solid var(--line)}
.bar .wrap{height:100%;display:flex;align-items:center;justify-content:space-between;gap:8px}
.brand{font-family:Georgia,"Times New Roman",serif;font-style:italic;font-weight:700;font-size:24px;color:var(--gold);text-decoration:none;white-space:nowrap}
.wa{display:flex;gap:6px}
.wa a{display:inline-flex;align-items:center;gap:6px;background:linear-gradient(135deg,var(--pill-a),var(--pill-b));color:var(--pill-text);text-decoration:none;font-weight:700;font-size:13px;padding:7px 12px;border-radius:999px;white-space:nowrap}

/* chips */
.chips{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--hh));z-index:19;background:var(--bg);border-bottom:1px solid var(--line)}
.chips .wrap{display:flex;gap:8px;overflow-x:auto;padding-top:10px;padding-bottom:10px;scrollbar-width:none}
.chips .wrap::-webkit-scrollbar{display:none}
.chips a{flex:none;text-decoration:none;font-weight:700;font-size:15px;color:var(--muted);border:1px solid var(--line);padding:5px 16px;border-radius:999px;transition:all .2s}
.chips a.on{background:var(--gold);border-color:var(--gold);color:var(--bg)}

/* hero */
.hero{text-align:center;padding:56px 0 40px;background:radial-gradient(ellipse at 50% 0%,var(--bg2),var(--bg) 70%)}
.crown{font-size:40px;line-height:1}
.hero h1{font-family:Georgia,"Times New Roman",serif;font-style:italic;font-weight:700;font-size:clamp(46px,12vw,84px);line-height:1.1;margin:6px 0 0;background:linear-gradient(180deg,var(--gold2),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
.menu-tag{display:inline-block;margin-top:6px;padding:2px 34px;border-top:1px solid var(--gold);border-bottom:1px solid var(--gold);color:var(--gold);letter-spacing:6px;font-family:Georgia,serif;font-style:italic;font-size:20px}
.hero p{max-width:460px;margin:16px auto 22px;color:var(--muted);font-size:17px}
.cta{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.btn{display:inline-block;text-decoration:none;font-weight:700;padding:11px 24px;border-radius:999px;background:linear-gradient(135deg,var(--pill-a),var(--pill-b));color:var(--pill-text)}
.btn.o{background:transparent;border:1px solid var(--gold);color:var(--gold)}

/* sections */
section{padding:34px 0 6px}
.sh{display:flex;align-items:center;gap:14px;margin-bottom:16px}
.sh h2{margin:0;font-size:28px;font-weight:900;color:var(--gold);white-space:nowrap}
.sh::before,.sh::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--gold))}
.sh::after{background:linear-gradient(270deg,transparent,var(--gold))}
.items{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:0 28px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:10px 22px}
.it{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px dashed var(--line)}
.it .n{font-size:18px;font-weight:600}
.it .d{flex:1;border-bottom:2px dotted var(--line);transform:translateY(5px);min-width:12px}
.it .p{font-weight:900;color:var(--pill-text);background:linear-gradient(135deg,var(--pill-a),var(--pill-b));border-radius:999px;padding:1px 14px;min-width:62px;text-align:center}

/* cakes */
.sizes{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.sz{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 10px;text-align:center}
.sz .s{font-size:22px;font-weight:900;direction:ltr}
.sz .p{display:inline-block;margin-top:6px;font-weight:900;color:var(--pill-text);background:linear-gradient(135deg,var(--pill-a),var(--pill-b));border-radius:999px;padding:1px 16px}
.fond{margin-top:16px;border:1px solid var(--gold);border-radius:20px;padding:22px;text-align:center;background:linear-gradient(160deg,var(--card),var(--bg2))}
.fond h3{margin:0;font-size:22px;color:var(--gold)}
.fond p{margin:6px auto 14px;color:var(--muted);max-width:480px}

/* branches */
.br{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.bc{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px;text-align:center}
.bc h3{margin:0;color:var(--gold);font-size:22px}
.bc p{margin:4px 0 14px;color:var(--muted)}
.bc .tel{display:block;font-weight:900;font-size:20px;margin-bottom:12px;direction:ltr}

footer{text-align:center;color:var(--muted);padding:40px 0 30px;font-size:14px;border-top:1px solid var(--line);margin-top:40px}
footer b{color:var(--gold)}

.rv{opacity:0;transform:translateY(14px);transition:opacity .5s,transform .5s}
.rv.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){.rv{opacity:1;transform:none;transition:none}html{scroll-behavior:auto}}
</style>
</head>
<body>

<div class="bar"><div class="wrap">
  <a class="brand" href="#top">Golden Sweet</a>
  <div class="wa">
    <a href="https://wa.me/201201068500" target="_blank" rel="noopener">واتساب المنصورة</a>
    <a href="https://wa.me/201019123164" target="_blank" rel="noopener">واتساب الغشام</a>
  </div>
</div></div>

<nav class="chips"><div class="wrap" id="chips"></div></nav>

<header class="hero" id="top"><div class="wrap">
  <div class="crown">👑</div>

<script>

 {id:"kunafa",t:"كنافة",i:[["كنافة سيجار",200],["كنافة كريمة",200],["كنافة مانجو",220],["كنافة قشطة",250],["كنافة كونو",250],["كنافة نوتيلا",250],["كنافة فواكه مشكلة",250],["كنافة عثمانلي",250],["كنافة مكسرات",350],["كنافة أساور مكسرات",350],["كنافة أساور نوتيلا",300],["كنافة بورمة",450]]},
 {id:"other",t:"حلويات وجلاش",i:[["جلاش كريمة",200],["جلاش مكسرات",300],["جلاش أساور نوتيلا",300],["عزيزية / أم علي",200],["مدلعة",200],["بقلاوة",350],["بسيمة سادة",300],["شكلمة",350],["رموش الست",220],["صوابع زينب",150],["بلح الشام",150]]},
 {id:"qatayef",t:"قطايف",i:[["قطايف كريمة",200],["قطايف قشطة",220],["قطايف مكسرات",300]]},
 {id:"basbousa",t:"بسبوسة",i:[["بسبوسة سادة",200],["بسبوسة تركي",250],["بسبوسة بندق ولوز",300],["بسبوسة قشطة",300],["بسبوسة فستق",350]]},
 {id:"maamoul",t:"معمول",i:[["معمول بالتمر",220],["معمول بالجوز",250],["معمول بالفستق",300]]}
];
var sizes=[["25×25",450],["30×30",600],["30×40",750],["40×40",950],["40×60",1500]];
function wl(n,msg){return "https://wa.me/"+n+"?text="+encodeURIComponent(msg);}
var h="",c="";
menu.forEach(function(s){
  c+='<a href="#'+s.id+'">'+s.t+'</a>';
  h+='<section id="'+s.id+'" class="rv"><div class="sh"><h2>'+s.t+'</h2></div><div class="items">';
  s.i.forEach(function(x){h+='<div class="it"><span class="n">'+x[0]+'</span><span class="d"></span><span class="p">'+x[1]+'</span></div>';});

sizes.forEach(function(x){h+='<div class="sz"><div class="s">'+x[0]+'</div><span class="p">'+x[1]+'</span></div>';});
h+='</div><div class="fond"><h3>🎂 تورت عجينة السكر</h3><p>بنعمل أي شكل تحبه. السعر بيختلف حسب الشكل والمقاس، ابعتلنا الفكرة ونقولك السعر.</p><div class="cta">'
 +'<a class="btn" href="'+wl(M1,"السلام عليكم، عايز أسأل عن تورت عجينة سكر")+'" target="_blank" rel="noopener">واتساب المنصورة</a>'
 +'<a class="btn o" href="'+wl(M2,"السلام عليكم، عايز أسأل عن تورت عجينة سكر")+'" target="_blank" rel="noopener">واتساب الغشام</a></div></div></section>';
h+='<section id="branches" class="rv"><div class="sh"><h2>فروعنا</h2></div><div class="br">'
 +'<div class="bc"><h3>فرع موقف المنصورة</h3><p>أمام شركة حسونة للأدوات الكهربائية</p><a class="tel" href="tel:01201068500">01201068500</a><a class="btn" href="https://wa.me/'+M1+'" target="_blank" rel="noopener">كلمنا واتساب</a></div>'
 +'<div class="bc"><h3>فرع الغشام</h3><p>أمام جراج صلاح سالم</p><a class="tel" href="tel:01019123164">01019123164</a><a class="btn" href="https://wa.me/'+M2+'" target="_blank" rel="noopener">كلمنا واتساب</a></div>'
 +'</div></section>';
document.getElementById("app").innerHTML=h;
document.getElementById("chips").innerHTML=c;

if("IntersectionObserver" in window){
  var rv=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add("in");rv.unobserve(e.target);}});},{threshold:.08});
  var secs=document.querySelectorAll("section");
  secs.forEach(function(s){rv.observe(s);});
  var links=document.querySelectorAll("#chips a");
  var sp=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){links.forEach(function(a){a.classList.toggle("on",a.getAttribute("href")==="#"+e.target.id);});}});},{rootMargin:"-30% 0px -60% 0px"});
  secs.forEach(function(s){sp.observe(s);});
}else{document.querySelectorAll(".rv").forEach(function(e){e.classList.add("in");});}
</script>
